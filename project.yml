name: WorkoutLogger
options:
  bundleIdPrefix: com.saad
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  WorkoutLogger:
    type: application
    platform: iOS
    sources:
      - path: WorkoutLogger
        excludes:
          - Info.plist
      - Shared
    dependencies:
      # Always built and embedded; the app only starts activities with LIVEACTIVITY set.
      - target: RestTimerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saad.workoutlogger
        PRODUCT_NAME: WorkoutLogger
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: UIFileSharingEnabled has no INFOPLIST_KEY_ setting.
        INFOPLIST_FILE: WorkoutLogger/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: WorkoutLogger
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # Weekly backups go to Documents, shown in Files under On My iPhone › WorkoutLogger.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Saves each finished workout to Apple Health as a strength-training workout."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "WorkoutLogger only writes workouts and does not read your health data."
        # HealthKit and the Live Activity are opt-in at build time (SPEC sections 9 and 4), e.g.
        #   SWIFT_ACTIVE_COMPILATION_CONDITIONS='HEALTHKIT LIVEACTIVITY'
        #   and sign with WorkoutLogger/WorkoutLogger-Health.entitlements (see scripts/build-ipas.sh)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  RestTimerWidget:
    type: app-extension
    platform: iOS
    sources:
      - RestTimerWidget
      - Shared
    info:
      path: RestTimerWidget/Info.plist
      properties:
        CFBundleDisplayName: Rest Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saad.workoutlogger.RestTimer
        PRODUCT_NAME: RestTimerWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  WorkoutLoggerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WorkoutLoggerTests
      - path: Fixtures/shrug_sample.csv
        buildPhase: resources
    dependencies:
      - target: WorkoutLogger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saad.workoutlogger.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutLogger.app/WorkoutLogger"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WorkoutLogger:
    build:
      targets:
        WorkoutLogger: all
        WorkoutLoggerTests: [test]
    test:
      config: Debug
      targets:
        - WorkoutLoggerTests
    run:
      config: Debug
    archive:
      config: Release
